[package]
name = "gott-core"
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tonic = "0.10"
prost = "0.12"
uuid = { version = "1.4", features = ["v4", "serde"] }
md5 = "0.7"
thiserror = "1.0"
