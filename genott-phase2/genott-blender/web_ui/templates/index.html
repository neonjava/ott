<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenOTT Video Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a3b);
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background: rgba(30, 30, 45, 0.85);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            max-width: 500px;
        }
        h1 {
            margin-bottom: 1rem;
            font-weight: 600;
            font-size: 2rem;
        }
        button {
            background: #4e9af1;
            border: none;
            color: #fff;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background: #3b81d0;
        }
        #status {
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        video {
            margin-top: 1.5rem;
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GenOTT Video Generator</h1>
        <button id="generateBtn">Generate Video</button>
        <div id="status"></div>
        <video id="resultVideo" controls style="display:none;"></video>
    </div>
    <script>
        const generateBtn = document.getElementById('generateBtn');
        const statusDiv = document.getElementById('status');
        const videoEl = document.getElementById('resultVideo');

        generateBtn.addEventListener('click', async () => {
            generateBtn.disabled = true;
            statusDiv.textContent = 'Starting generation...';
            const resp = await fetch('/generate', {method: 'POST'});
            const data = await resp.json();
            const taskId = data.task_id;
            pollStatus(taskId);
        });

        async function pollStatus(taskId) {
            const interval = setInterval(async () => {
                const res = await fetch(`/status/${taskId}`);
                const info = await res.json();
                statusDiv.textContent = `Status: ${info.status}`;
                if (info.status === 'done') {
                    clearInterval(interval);
                    fetchVideo(taskId);
                }
            }, 2000);
        }

        async function fetchVideo(taskId) {
            const videoUrl = `/video/${taskId}`;
            videoEl.src = videoUrl;
            videoEl.style.display = 'block';
            statusDiv.textContent = 'Video ready!';
            generateBtn.disabled = false;
        }
    </script>
</body>
</html>
